# Part 1. Everything it does is in the private code repository; this file only says
# when, and for how long at most.
#
# Keeps starting fresh passes for most of the gap until the next scheduled start, so the
# clock is nearly always doing something. Each pass commits on its own.

name: Sync 1

on:
  schedule:
    - cron: "41 */2 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Do everything except commit"
        type: boolean
        default: false

# Queue rather than overlap. Two runs of the same part would repeat each other's work and
# race each other's commit for no gain.
concurrency:
  group: sync-1
  cancel-in-progress: false

jobs:
  run:
    uses: ./.github/workflows/_sync.yml
    secrets: inherit
    with:
      shard: "1"
      timeout: 115
      dry_run: ${{ inputs.dry_run || false }}
      loop_minutes: 100
