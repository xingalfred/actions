# Part 0. Everything it does is in the private code repository; this file only says
# when, and for how long at most.
#
# Runs back to back: scheduled about as often as one takes, with the concurrency group
# below keeping two from overlapping. Each run is one pass and reports its own outcome.

name: Sync 0

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Do everything except commit"
        type: boolean
        default: false

# Queue rather than overlap. Two runs of the same part would repeat each other's work and
# race each other's commit for no gain.
concurrency:
  group: sync-0
  cancel-in-progress: false

jobs:
  run:
    uses: ./.github/workflows/_sync.yml
    secrets: inherit
    with:
      shard: "0"
      timeout: 25
      dry_run: ${{ inputs.dry_run || false }}
