# Part 0. Everything it does is in the private code repository; this file only says
# when, and for how long at most.
#
# Runs back to back *within* a run: one start does several passes, each committing on its
# own. The schedule fires more often than a run takes only to shorten the gap after one ends
# — it is not what paces this, and measured on 2026-08-08 it delivered one fire in nine.
#
# A start arriving mid-run waits, and a second replaces the waiting one rather than queueing
# behind it, so at most one is ever pending.
name: Sync 0

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Do everything except commit"
        type: boolean
        default: false

# Queue rather than overlap. Two runs of the same part would repeat each other's work and
# race each other's commit for no gain.
concurrency:
  group: sync-0
  cancel-in-progress: false

jobs:
  run:
    uses: ./.github/workflows/_sync.yml
    secrets: inherit
    with:
      shard: "0"
      timeout: 60
      dry_run: ${{ inputs.dry_run || false }}
      loop_minutes: 45
