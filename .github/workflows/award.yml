# Scheduled sync. Runs a script from the private code repository; everything it does,
# and why this file says so little, is documented there.

name: Sync

on:
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:
    inputs:
      shards:
        description: "JSON array of shard numbers"
        default: "[0,1,2]"
      dry_run:
        description: "Do everything except commit"
        type: boolean
        default: false

concurrency:
  group: sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(inputs.shards || '[0,1,2]') }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ secrets.CODE_REPO }}
          token: ${{ secrets.GH_PAT }}
          path: code
      - uses: actions/checkout@v4
        with:
          repository: ${{ secrets.DATA_REPO }}
          token: ${{ secrets.GH_PAT }}
          path: data

      - uses: astral-sh/setup-uv@v5

      - name: Run
        working-directory: code
        env:
          DATA_DIR: ${{ github.workspace }}/data
        run: ./scripts/ci_run.sh ${{ matrix.shard }}

      - uses: actions/upload-artifact@v4
        # Even when the shard failed: the log says only "see the run table", and the run
        # table is in these files. Without this a failure leaves nothing to read.
        if: always()
        with:
          name: part-${{ matrix.shard }}
          if-no-files-found: ignore
          path: /tmp/part-${{ matrix.shard }}-*.db
          retention-days: 1

  collect:
    needs: run
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ secrets.CODE_REPO }}
          token: ${{ secrets.GH_PAT }}
          path: code
      - uses: actions/checkout@v4
        with:
          repository: ${{ secrets.DATA_REPO }}
          token: ${{ secrets.GH_PAT }}
          path: data
      - uses: astral-sh/setup-uv@v5

      - uses: actions/download-artifact@v4
        with:
          pattern: part-*
          path: /tmp/parts
          merge-multiple: true

      - name: Collect
        env:
          # This job does not run ci_run.sh, so it has to silence itself: the collect step
          # was naming the programs it placed into a world-readable log.
          AWARD_QUIET: "1"
        run: uv run --project code code/scripts/ci_collect.py data --parts /tmp/parts

      - name: Commit
        # Skipped on a dry run, which is how the first run on a fresh runner should go: the
        # checkout, the install and every step below happen for real, the artifacts are
        # uploaded to inspect, and nothing is written to the data repository.
        # `inputs` is empty on a schedule, so `!= true` means scheduled runs always commit.
        if: inputs.dry_run != true
        working-directory: data
        run: |
          git config user.name  "sync"
          git config user.email "sync@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "nothing changed"; exit 0; }
          git commit -m "Sync $(date -u +%Y-%m-%dT%H:%MZ)"
          for _ in 1 2 3; do
            git push && exit 0
            git pull --rebase --autostash
          done
          exit 1
